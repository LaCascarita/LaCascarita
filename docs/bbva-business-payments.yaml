            taxAmount: 
              type: object
              description: amounts. 
              properties:
                amount:
                  type: string
                  description: IVA amount
            totalAmount:
              type: object
              description: amounts
              properties:
                amount:
                  type: string
                  description: Cumulative total
            subtotalAmount:
              type: object
              description: amounts
              properties:
                amount:
                  type: string
                  description: subtotal amount 
            groupsDetail:
