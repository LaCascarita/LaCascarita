  /spei-transfers:
    summary: SPEI Transfers
    description: Pay to third party accounts in other banks via SPEI interbank transfers.
    post: 
      tags:
        - 2-legged OAuth 
      summary: |
          Pay to third party accounts in other banks via SPEI interbank transfers.
      description: |
         Endpoint that enables interbank transfers from a BBVA source account—linked to the channel contract—to another bank account using CLABE, debit card number, or mobile number format in Mexican Pesos (MXP)
      requestBody:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/POST_spei-transfer_Request"
              examples:
                check_account:
                  $ref: "#/components/examples/POST_spei-transfer_CLABE_Request_Example"
                debit_card:
                  $ref: "#/components/examples/POST_spei-transfer_DEBITO_Request_Example"
                celular:
                  $ref: "#/components/examples/POST_spei-transfer_CEL_Request_Example"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/POST_spei-transfer_Response"
              examples:
                default:
                  $ref: "#/components/examples/POST_spei-transfer_Response_Example"
        "400":
