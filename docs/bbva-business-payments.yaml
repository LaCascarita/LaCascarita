components:
  schemas:
    POST_internal-transfer_Request:
      title: internal-transfers Request
      description: Request body for internal-transfers endpoint.
      required:
            - transferAmount
            - concept
            - sender
            - receiver
            - operationDate
      properties:
        transferAmount:
          description: |
            Information related to the transfer amount.
          type: object
          additionalProperties: false
          required:
            - value
          properties:
            value: 
              description: Information related to the value of transfer amount.
              type: object
              additionalProperties: false
              required:
                - currency
                - amount
              properties:
                currency:
                  description: String for specifying the currency.
                  type: object
                  additionalProperties: false
                  required:
                     - code
                  properties:
                    code:
                      description: |
                                  Debit account currency.  
                                  - `NOTE:` This currency must be the same as the beneficiary's account (receiverAccountNumber), and only the following currencies are allowed:
                                  * `MXP`: Denomination of Mexican currency.
                                  * `EUR`: Denomination of the official currency of the eurozone.
                                  * `USD`: Denomination of the US dollar.

                      type: string
                      enum: 
                      - MXP
                      - EUR
                      - USD
                amount:
                  description: Amount to be transferred. The length of the amount is a maximum of 13 integers and 2 decimals, without a thousands separator and using a period (.) as the decimal separator.
                  type: number
                  example: 9999999999999.99
        concept:
          description: |
            Transfer short description. It has a maximum length of 20 characters, do not include special characters, accents, or Ñ, to avoid rejections.
          type: string
        sender:
          description: |
            Information related to the origin account were the funds will be debited.
          type: object
          additionalProperties: false
          required:
            - contract
          properties:
            contract:
              description: Information related to the origin account contract.
              type: object
              additionalProperties: false
              required:
                - product
              properties:
                product:
                  description: Information related to the financial product.
                  type: object
                  additionalProperties: false
                  required:
                   - checkAccount
                  properties:
                      checkAccount: 
                        description: Information related to the checking account.
                        type: object
                        required:
                          - accountNumber
                        properties:
                          accountNumber:
                            description: |
                                         20-digit origin account number, previously registered and associated with the service specified in the contract, from which the funds will be debited.  
                                         - `NOTE:` The 20-position account fromat can be found in details provided within Annex "A" of the contract, where the  20-position account number is visible.
                            type: string
        receiver:
            description: |
              Information related to the destination of the transfer.
            type: object
            additionalProperties: false
            required:
              - contract
            properties:
              contract:
                description: Information related to the product that receives the transferred amount.
                type: object
                additionalProperties: false
                required:
                  - product
                properties:
                  product:
                    description: |
                                 Information related to the financial product.  
                                 When the beneficiary account is a checking account (10 positions) or CLABE (18 positions), the "accountNumber" field is reported; if it is a debit card, the "cardNumber" field is reported.
                    type: object
                    additionalProperties: false
                    properties:
                      checkAccount: 
                        description: Information related to the checking account.
                        type: object
                        required:
                          - accountNumber
                        properties:
                          accountNumber:
                            description:  |
                                          Destination account number where the funds will be credited, the account must be provided with 10 digits, or in case the format its a CLABE account , 18 digits must be provided.  
                                          - `NOTE:` If a CLABE account (which must be linked to a BBVA account) is reported with 18 positions, the API will internally take and extract the account to 10 positions.
                            type: string
                      debitCard:
                        description: financial product either debit card or clabe.
                        type: object
                        required:
                          - cardNumber
                        properties:
                          cardNumber:
                            description: |
                                          Debit card number where the funds will be credited, the account must be provided with 16 digits.  
                                            - Example: "4027665701414980"
                            type: string
        operationDate:
          description: |
                       String based on the ISO-8601 standard to specify the date on which the transfer is ordered.  
                       In the absence of payment scheduling, the date must always be the current date; otherwise, the transaction will be rejected.
          type: string
          format: "AAAA-MM-DD"
          example: 2025-01-30

    POST_internal-transfer_Response:
      title: internal-transfers Response
      description: Response for POST_internal-transfers request
      required:
        - operationDate
        - executionDate
        - authorizationInfo
        - sequenceReference
        - accountingDate
        - id
        - finalBalanceSender
        - finalBalanceReceiver

      properties:
        operationDate:
          description: |
            String based on the ISO-8601 standard to specify the transaction operation date.
          type: string
          format: "AAAA-MM-DDTHH:MM:SS.000-0600"
        executionDate: 
          description: |
            String based on the ISO-8601 standard that specifies the date on which the channel executed the payment instruction.
          type: string
          format: "AAAA-MM-DD"
        id:
          description: |
            Unique transfer identifier.
          type: string
        finalBalanceSender:
          description: |
            Information related to the origin of the transfer.
          type: object
          additionalProperties: false
          required:
              - balance
          properties:
            balance:
              description: |
                  Information related to the balance of the sender.
              type: object
              additionalProperties: false
              required:
                  - amount
              properties:
                  amount:
                    description: Post-debit balance.
                                 This field will retain a fixed value of 0.0.
                    type: number
        finalBalanceReceiver:
          description: |
            Information related to the destination of the transfer.
          type: object
          additionalProperties: false
          required:
              - balance
          properties:
            balance:
              description: |
                  Information related to the balance of the receiver.
              type: object
              additionalProperties: false
              required:
                  - amount
              properties:
                  amount:
                    description: Post-credit balance.
                                 This field will retain a fixed value of 0.0.
                    type: number
        authorizationInfo: 
          description: |
            Information related to the authorization.
          type: object
          additionalProperties: false
          required:
            - senderAuthNumber
            - receiverAuthNumber
          properties:
            receiverAuthNumber:
              description: |
                           9-digit number to identify the authorization for movement of the charge account.                           
                           This is an internal authorization number and you should not use it.
              example: “000001127”
              type: string
            senderAuthNumber:
              description: |
                           9-digit number that refers to the authorization for movement of the credit account.  
                           This is an internal authorization number and you should not use it.
              type: string
              example: “000001128”
        sequenceReference:
            description: |
                        Unique 10-digit channel folio identifier used specifically for transaction queries and tracking.
                        
                          This field is known by different names depending on the endpoint where it is used.
                          - It is referred to as `"transaction"` in both the PDF receipt endpoint (GET v1/transfer-pdf) and the transaction query endpoint (GET v1/transactions).
                          - For the SPEI query endpoint (GET v1/spei-transfers/{spei-transfer-id}/status), it is known as `"spei-transfer-id"`.

            type: string
        accountingDate:
            description: |
                String based on the ISO-8601 standard to specify the date on which the transaction was recorded in internal accounting systems.  
                This date may vary from the execution date depending on the change of day of the payment system.
            type: string 
            format: "AAAA-MM-DD"

    POST_spei-transfer_Request:
      title: spei-transfers
      description: Request body for spei-transfer endpoint
      required:
        - operationDate
        - concept
        - numericReference
        - sender
        - receiver
        - name
        - bank
        - transferAmount
        - reference
        - digitalTaxCertificateSender
        - digitalTaxCertificate
      properties:
        operationDate:
          description: |
            String based on the ISO-8601 standard to specify the date on which the transfer is ordered.  
            In the absence of payment scheduling, the date must always be the current date; otherwise, the transaction will be rejected.
          example: "2025-01-27"
          type: string
          format: "AAAA-MM-DD"
        concept:
          description: |
            Transfer short description. It has a maximum length of 20 characters. Do not include special characters, accents, or Ñ, to avoid rejections.
          type: string
        numericReference: 
          description: |
            Payment folio provided by the participant to uniquely identify the payment, with a maximum of 7 positions and a minimum of 1 position.  
            If "0" is entered, a 7-digit random number will be assigned.  
              `Example entry: "0"`
              `Example modified entry: "0791784"` 

            If the entered value is less than 7 digits, the system will complete with leading zeros.  
              `Example entry: "01"`
              `Example modified entry: "0000001"`
          type: string
        reference: 
          description: |
            Brief description of reference with a maximum of 10 positions.  
            Informative field.
          type: string
        sender: 
          description: |
            Information related to the origin account were the funds will be debited.
          type: object
          required:
            - contract
          properties:
            contract:
              description: |
                Information related to the origin account contract.
              type: object
              required:
                - product
              properties: 
                product:
                  description: |
                    Information related to the financial product either debit card or clabe.
                  type: object
                  required:
                    - checkAccount
                  properties: 
                    checkAccount:
                      description: |
                        Information related to the checking account.
                      type: object
                      required:
                        - accountNumber
                      properties:
                        accountNumber:
                          description: |
                               20-digit origin account number, previously registered and associated with the service specified in the contract, from which the funds will be debited.  
                                - `NOTE:` The 20-position account fromat can be found in details provided within Annex "A" of the contract, where the  20-position account number is visible.
                               
                          type: string               
        digitalTaxCertificateSender:
          description: |
            Information about the client's RFC (mexican Tax Identifier).
          type: object
          required:
            - taxpayer
          properties:
            taxpayer:
              description:
                Client's RFC (mexican Tax Identifier).
              type: string
        digitalTaxCertificate:
          description: |
            Information related to the beneficiary's RFC (mexican Tax Identifier). 
          type: object
          required:
            - taxpayer
          properties:
            taxpayer:
              description:
                Beneficiary's RFC (mexican Tax Identifier).
              type: string
        receiver: 
          description: |
            Information related to the destination of the transfer.
          type: object
          required:
            - contract
          properties:
            contract:
              description: |
                Information related to the product that receives the transferred amount.
              type: object
              required:
                - product
              properties: 
                product:
                  description: |
                              “Information related to the financial product of the beneficiary.

                              The data reported within this field depends on the type of beneficiary account:

                                - Interbank CLABE: The `interbankCode` field is reported inside the `debitCard` object.
                                - Debit Card: The `cardNumber` field is reported inside the `debitCard` object.
                                - Mobile Phone: The `cellphoneNumber` field is reported inside the `expressAccount` object.

                  type: object
                  properties: 
                    debitCard:
                      description: |
                        Information related to the financial product either debit card or clabe.
                      type: object
                      required:
                        - interbankCode
                        - cardNumber
                      properties:
                        interbankCode:
                          description: |
                            18-position CLABE account number where the funds will be credited.
                          type: string
                        cardNumber:
                          description: |
                            16-digit debit card number where the funds will be credited.
                              - Example: "4027665701414980"
                          type: string
                    expressAccount:
                      description: |
                        Information related to the financial product. Cellphone number.
                      type: object
                      required:
                        - cellphoneNumber
                      properties:
                        cellphoneNumber:
                          description: |
                            10-digit cell phone number related to the destination account where the funds will be credited.  
                            - `NOTE:` Mobile payments are only available through the SPEI interbank payment system; this flow is different from the DIMO payment system. To make mobile payments, the mobile phone must have never been enrolled in DIMO and must also be linked to an account at a participating SPEI institution.   
                            - Example: 5512345678
                          type: string
        name:
          description: |
              Beneficiary name. It has a maximum length of 40 characters.
          type: string
        bank:
          description: |
              Information related to the bank.
          type: object
          required:
            - financialEntityId
            - name
          properties:
            financialEntityId:
              description: |
                 SPEI Code of the Receiving Bank.  
                 -`NOTE:` To find the SPEI code of the receiving bank, please refer to the official Banxico website `www.banxico.org.mx/cep-scl/listaInstituciones.do`.  
                 
                 The code corresponds to the last four digits listed for each bank.  
                 For BBVA the value corresponds to “0012”
              type: string
            name:
              description: |
                Recipient bank's SPEI key (Provide the same value as bank.financialEntityId).
              type: string
        transferAmount:
          description: |
            Information related to the transfer amount.
          type: object
          required:
            - value
          properties: 
            value:
              description:  |
                Information related to the value of transfer amount.
              type: object
              required: 
                - amount
              properties:
                amount:
                  description: |
                    Amount to be transferred.  
                    The length of the amount is a maximum of 13 integers and 2 decimals, without a thousands separator and using a period (.) as the decimal separator.
                  type: string
                  example: 9999999999999.99
        
    POST_spei-transfer_Response:
      title: spei-transfers response
      description: Response for spei-transfers request
      properties:
        operationDate: 
          description: String based on the ISO-8601 standard to specify the transaction operation date.
          type: string
          format: “YYYY-MM-DDTHH:MM:SS.000-0600”
          example: "2021-01-21T00:00:00.0-0600"
        id:
          description: identifier of the created transfer.
          type: string
        finalBalanceReceiver:
          type: object
          description: Recipient of the final balance
          properties:
            availableBalance:
              description: Information related to transfer identifiers.
              type: object
              properties:
                currency:
                  type: object
                  description: object with information about the currency
                  properties:
                    code:
                      description: String based on ISO-4217 to specify the currency.
                      type: string
                    name:
                      description: String based on ISO-4217 to specify the currency.
                      type: string
                    id:
                      description: String based on ISO-4217 to specify the currency.
                      type: string
        entityId:
          description:  Information related to transfer identifiers.
          type: object
          properties:
            applicationId: 
              description: |
                           Interbank folio.  
                           A 10-digit transaction folio used at the institutional level to identify and track interbank transfers.  
                           This folio is for informational purposes only.
              type: string
              example: "0026380946"
            trackingId:
              description: |
                          SPEI tracking key in 24-character format.  
                          Format (This ID is known locally as 'clave de rastreo'): APIC + #### + AAMMDD + entityId.applicationId.
              type: string
              example: “APIC01002503210026128252”
        sequenceReference:
          description: |
                        Unique 10-digit channel folio identifier used specifically for transaction queries and tracking.
                        
                          This field is known by different names depending on the endpoint where it is used.
                          - It is referred to as `"transaction"` in both the PDF receipt endpoint (GET v1/transfer-pdf) and the transaction query endpoint (GET v1/transactions).
                          - For the SPEI query endpoint (GET v1/spei-transfers/{spei-transfer-id}/status), it is known as `"spei-transfer-id"`.

          type: string
        accountingDate: 
          description: String based on the ISO-8601 standard to specify the date on which the transaction was recorded in internal accounting systems.
          format:  “AAAA-MM-DD”
    
    GET_transfer-pdf_Response:
      title: transfer-pdf-response
      description: Response for GET-transfer-pdf request
      properties:
        content:
          description: |
            main content of the answer
          items:
            type: object
          additionalProperties: false
          properties:
            data:
              description: |
                Contains the Base64 code of the receipt in quotation marks  
                `NOTES:`  
                To view it, you will need a Base64 to PDF decoder.  
                Transaction result, values:
                - `REALIZADA`
                - `NO REALIZADA`
                  
                The "REALIZADA" status only indicates that the transaction was executed successfully, but does not reflect whether it was settled or refunded.
                
                On the other hand, the "NO REALIZADA" status indicates that an error occurred during processing and the transaction wasn't settled.
              type: string
        
             
    GET_transaction_Response:
      title: transactions-response
      description: response for transactions request.
      properties:
        transaction:
          items:
            type: object
          additionalProperties: false
          required:
            - sequenceReference
            - operationYear
            - codeTransaction
            - movementNumber
            - concept
            - applicationDate
            - applicationHour
            - registryDate
            - currentDate
            - referenceAST
            - paymentDescription
            - channel
            - accountingDate
            - internalReferenceTransaction

            
          properties:
            sequenceReference:
              description: |
                Unique folio identifier of the channel generated in the SPEI, Same Bank (BBVA) and CIE transfer.
              type: string
              example: "1234542"
            operationYear:
              description: |
                Year in which the operation was performed.
              type: string
            codeTransaction:
              description: |
                Transaction code.  
                - `NOTE:` The transaction differentiates the channel where the operation was carried out (this is internal information, you must not use it when consuming this API).
              type: string
            amount:
              description: |
                Information related to the transfer amount.
              type: object
              properties:
                amount:
                  description: | 
                    Transfer amount.
                  type: string
            currency: 
              type: object
              properties:
                code:
                  description: | 
                    String for specifying the currency.
                  type: string
            movementNumber:
              description: |
                Only shown for successful operations, indicating 
                the number ofmovement in the account
                orderer.
              type: string
            sender:
              description: Information related to the origin of the transfer.
              type: object
              properties:
                name:
                  type: string
                  description: Paying account holder
                numberAccount:
                  type: string
                  description: 20-digit origin account number.
                amount:
                  description:  Information related to the transfer amount.
                  type: object
                  properties:
                    currency:
                      description: String for specifying the currency.
                      type: object
                      properties:
                        code: 
                          description: Currency of the transaction.
                          type: string
                fiscalNumber:
                  type: string
                  description: RFC (mexican Tax Identifier) of the ordering account holder
                clientNumber:
                  type: string
                  description: Contract number reported in the contract.
            receiver: 
              description: Information related to the destination of the transfer.
              type: object
              properties:
                informationReceiver:
                  type: object 
                  properties:
                    name:
                      type: string
                      description: |
                        Beneficiary name.  
                        In BBVA Payments: Account holder.  
                        In SPEI Payments: Beneficiary indicated in the original transaction.
                    numberAccount:
                      type: string
                      description: Last 4 digits of the beneficiary account.
                    bankInformation:
                      type: object
                      description: |
                        Information related to the beneficiary bank.
                      properties:
                        id:
                          type: string
                          description: Beneficiary bank code
                        name:
                          type: string
                          description: Beneficiary bank name
            concept:
              description: |
                Transfer short description.
              type: string
            applicationDate:
              description: |
                Transaction operation date.
              type: string
            applicationHour:
              description: |
                Transaction operation time.
              type: string
            status:
              type: object
              properties:
                id:
                  type: string
                  description: |
                              Result of the operation, values:  
                                  ● `REALIZADA`
                                  ● `NO REALIZADA`
                                  - `NOTE:` The "REALIZADA" status only indicates that the transaction was executed successfully, but does not reflect whether it was settled or returned.  
                                  On the other hand, the "NO REALIZADA" status indicates that an error occurred during processing and the account could not be charged.
                description:
                  type: string
                  description: |
                    For operation `REALIZADA:` this field is not displayed  
                    For operation `NO REALIZADA:` Error description
            operationErrorCode:
              type: string
              description: |
                    For operation `REALIZADA:` this field is not displayed  
                    For operation `NO REALIZADA:` Error code
            currentDate:
              description: |
                Date and time it is executed
                query API operations
              type: string
            interbankReference:
              type: string
              description: |
                            For SPEI Payments and "REALIZADA" transactions: Interbank Folio  
                            For "NO REALIZADA" transactions, BBVA and CIE Payments: The field is not displayed.
            interbankTrackingId:
              type: string
              description: |
                            'For SPEI Payments with status "REALIZADA" transactions: "Clave de rastreo"  
                            For "NO REALIZADA" transactions, BBVA and CIE Payments: The field is not displayed.'
            numericReference:
              description: 7-digit numerical reference applies only to SPEI.
              type: string
            paymentDescription:
              description: |
                Payment type, values:
                   `PAGO BBVA`
                   `PAGO SPEI` 
                   `PAGO CIE `
              type: string
            accountingDate:
              description: |
                For operation "NO REALIZADA":
                Field not shown  
                For operation "REALIZADA":
                Date Value of the transaction
              type: string
            cieGuide:
              type: string
              description: | 
                            For CIE payment "REALIZADA" : CIE guide.  
                            For BBVA Payment/SPEI Transfer/NOT MADE operations, the field is not displayed.
            referenceCIE:
              type: string
              description: |
                            For CIE payment "REALIZADA" : CIE Reference.  
                            For other operations BBVA Payment / SPEI Transfer / NOT MADE, the field is not displayed.

    GET_transfer_fees_Response:
      title: transfer-fees-Response
      description: response for transfer fees request
      properties:
            statusPayment:
              description: |
                contract and payment status.
              type: object
              properties:
                id:
                  description: |
                    If the contract status value is anything other than Active, the field will be not returned and only the account record and groupdetailrecord fields will be returned, both with a value of 0. 
                    A1 = "Activo" 
                  type: string
            extendedData:
              description: "registration date in yyyy-mm-dd format"
              type: object
              properties:
                creationDate:
                  description: |
                                Contract start date  
                                Format “yyyy-mm-dd”
                  type: string
                modificationDate:
                  description:  |
                                Date of accumulation  
                                Format “yyyy-mm-dd”
                  type: string
            rate:
