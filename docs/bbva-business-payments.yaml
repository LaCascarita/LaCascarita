  /transfer-pdf/{transaction}/document:
      summary: Transfer PDF
      description: Generate an operation receipt in PDF.
      get: 
        tags:
          - 2-legged OAuth 
        summary: |
          Generate an operation receipt in PDF 
        description: |
          API that generates a PDF “Base64” with the summary of the payment previously instructed in Channel (up to 90 days).
        parameters:
        - name: transaction
          description: |
              The channel's unique folio with 10 positions, obtained from the “sequenceReference” field in the response of transfers from the same bank, SPEI and CIE.  
                - It can also be retrieved by querying the transactions endpoint using the transaction date, where it appears in the same field.
                - Example: "0000077793"
          required: true
          example: '0000000205'
          in: path
          schema:
            description: |
                  The channel's unique folio, with 10 positions, is obtained from the "sequenceReference" field in the response of transfers from the same bank, SPEI and CIE.  
                        - It can also be retrieved by querying the transaction's endpoint using the transaction date, where it appears in the same field.
            example: '0000000205'
            type: number
        - name: operationYear
          description: |
                      Year in which the transaction was made “YYYY”
                        - Example: "2025"
          required: true
          in: query
          schema:
            description: |
                        Year in which the transaction was made “YYYY”
                          - '2019'
            type: string
        - name: productId
          description: |
                      Product identifier.The fixed value for this field will always be "COMPROBANTE_PAGO"
                        - Example: "COMPROBANTE_PAGO"
          required: true
          in: query
          schema:
            description: Product identifier.The fixed value for this field will always be "COMPROBANTE_PAGO"
            example: "COMPROBANTE_PAGO"
            type: string
        - name: version
          description: |
                      Version. The fixed value for this field will always be “1.1.”
                        - Example: "1.1"
          required: true
          in: query
          schema:
            description: Version. The fixed value for this field will always be “1.1.”
            example: 1.1
            type: number
        - name: type
          description: |
                      Document type for the final output. The default value for this field will always be "PDF"
                        - Example: "PDF"
          required: true
          in: query
          schema:
            description: Document type for the final output. The default value for this field will always be "PDF"
            example: "PDF"
            type: string
        responses:
          "200":
            description: OK.
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/GET_transfer-pdf_Response"
                examples:
                  default:
                    $ref: "#/components/examples/GET_transfer-pdf_Response_Example"
          
          "400":
            description: Bad Request
            content:
              application/json:
                examples:
                  mandatoryParametersMissing:
                    description: JSON output example for mandatory parameters missing.
                    value:
                      messages:
                        - code: mandatoryParametersMissing
                          message: Required input parameters missing.
                          type: ERROR
                  Range90DaysExceeded:
                    description: JSON output example for mandatory parameters missing.
                    value:
                      messages:
                        - code: functionalError
                          message: 00931219#SOLO SE PUEDEN CONSULTAR 90  DIAS ANTERIORES
                          parameters: []
                          type: FATAL
                  UniqueFolioNotFound:
                    description: JSON output example for mandatory parameters missing.
                    value:
