                          message: 01573233#CUENTA BLOQUEADA
                          parameters: []
                          type: FATAL
                InvalidAccountError:
                    description: The destination CLABE account belongs to a BBVA account, correct the field
                    value:
                      messages:
                        - code: functionalError
                          message: 01573224#CUENTA DESTINO INVALIDA
                          parameters: []
                          type: FATAL
                DestinationBankError:
                    description: The destination bank fields "bank.financialEntityId" and "bank.name" are not in the active bank catalog or belong to BBVA. Correct the fields "bank.name" and "bank.financialEntity"
