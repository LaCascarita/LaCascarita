openapi: 3.0.0
info:
  title: Business Payments
  description: |
    This API handles individual payments via `SPEI interbank and BBVA transfers.` Users can `check payment status` and review `fee summaries. Note:` To set up asynchronous webhook notifications for status changes, contact your sales executive for details.
  version: 1.1.38
x-authentication-uri:
  - url: https://apis.mx.bbvaapimarket.com/auth/oauth/v2/token
    description: Production Server
  - url: https://sbx.mx.bbvaapimarket.com/auth/oauth/v2/token
    description: Sandbox Server 
  - url: https://qa-apis-work-mx.bbvaapimarket.com/auth/oauth/v2/token
    description: Advanced Sandbox Server

servers:
  - url: https://apis.mx.bbvaapimarket.com/mx/business-payments/v1
    description: Production Server
  - url: https://sbx.mx.bbvaapimarket.com/mx/business-payments/v1
    description: Sandbox Server
  - url: https://qa-apis-work-mx.bbvaapimarket.com/mx/business-payments/v1
    description: Advanced Sandbox Server

tags:
  - name: 2-legged OAuth
    description: La autenticación del endpoint es de 2 patas mediante OAuth.

paths:
  /internal-transfers:
    summary: Internal Transfers
    description: Pay to third party BBVA Accounts.
    post:
      tags:
        - 2-legged OAuth
      summary: |
        Pay to third party BBVA Accounts.
      description: |
        API that allows you to transfer funds from your own accounts linked to the contract to third-party BBVA accounts, in local currency, euros, or dollars—provided both accounts operate in the same currency. Payments can be directed to BBVA account numbers, CLABE numbers, or debit card numbers
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/POST_internal-transfer_Request"
            examples:
              check_account:
                $ref: "#/components/examples/POST_internal-transfer_CH_Example"
              debit_card:
                $ref: "#/components/examples/POST_internal-transfer_TDD_Example"
              CLABE:
                $ref: "#/components/examples/POST_internal-transfer_CLABE_Example"

      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/POST_internal-transfer_Response"
              examples:
                default:
                  $ref: "#/components/examples/POST_internal-transfer_Response_Example"
        "400":
          description: Bad Request
          content:
            application/json:
              examples:
                mandatoryParametersMissing:
                  description: JSON output example for mandatory parameters missing.
                  value:
                    messages:
                      - code: mandatoryParametersMissing
                        message: Required input parameters missing.
                        type: ERROR
                InsufficientAvailable:
                    description: Account Insufficient available error
                    value:
                      messages:
                        - code: functionalError
                          message: 01085041#BGE0515 DISPONIBLE INSUFICIENTE
                          parameters: []
                          type: FATAL
                AccountBlockedDuetoInactivity:
                    description: The charging account is blocked
                    value:
                      messages:
                        - code: functionalError
                          message: 01085041#BGE1390 CUENTA CON BLOQUEO O CANCELACIÓN AUTOMATICA POR INACTIVIDAD
                          parameters: []
                          type: FATAL
                AccountBlockedByDepartment:
                    description: The source account does not record any movement or balance for a prolonged period.
                    value:
                      messages:
                        - code: functionalError
                          message: 01085041#BGE0181 CUENTA BLOQUEADA POR DEPARTAMENTO
                          parameters: []
                          type: FATAL
                CurrencyError:
                    description: The charge account does not match the indicated currency.
                                 Correct the "tranferAmount.value.currency.code" field to the currency corresponding to the "sender.contract.product.checkAccount.accountNumber" account.
                    value:
                      messages:
                        - code: functionalError
                          message: LA DIVISA ES INCORRECTA
                          parameters: []
                          type: FATAL
                CurrencyAndAccountError:
                    description: The currency entered is not the same as the source and destination accounts.
                                Correct the "transferAmount.value.currency.code" field to the correct currency for the source and destination accounts.
                    value:
                      messages:
                        - code: functionalError
                          message: 01085041#BGE0664 DIVISA NO COINCIDE CON LA DE LA CUENTA
