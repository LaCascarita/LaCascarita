                monthlyAmount:
                  type: string
                  description: Total amount accumulated per month by group.
                unitCost: 
                  type: string
                  description: Unit cost amount per transaction.
            accountRecords:
              type: string
              description: Account records.
            groupsDetailRecords:
              type: string
              description: Indicates the number of groups generated by the query.

    GET_spei-transfers_Response:
      title: spei-transfers status response
      description: Response body for spei-transfers status endpoint.
      properties:
        trackingFolio:
          description: |
                        A 10-digit transaction folio used at the institutional level to identify and track interbank transfers. This folio is for informational purposes only.  
                        Corresponds to the "entityId.applicationId" field of the "spei-transfers" service.
          type: string
        description:
          description: |
                        Transfer short description. It has a maximum length of 20 characters.  
                        Corresponds to the “concept” field of the “spei-transfers” service.
          type: string
        sender:
          description: Information related to the origin of the transfer.
          type: object
          required:
             - numberAccount
          properties:
            numberAccount:
               description: |
                            20-digit origin account number, previously registered and associated with the service specified in the contract, from which the funds will be debited.  
                            The output format is 23 characters long, consisting of the 20-digit source account number plus 3 spaces, grouped into blocks of 4 digits, space, 4 digits, space, 2 digits, space, 10 digits.  
                            The 20-digit account number is the one previously registered and associated with the service in the channel contract, from which the funds were debited.  
                            - `NOTE:` The 20-digit account number can be found in the channel contract, specifically in the "Issues" appendix, where the 20-digit format is detailed.
               type: string
               example: "9999 9999 99 999999999"
        receiver:
          description: |
            Information related to the destination of the transfer.
          type: object
          required:
             - informationReceiver
          properties:
              informationReceiver:
                description: Information related to the destination of the transfer.
                type: object
                required:
                  - name
                  - numberAccount
                  - typeAccount
                properties:
                  name:
                    description: Beneficiary name. It has a maximum length of 40 characters.
                    type: string
                  numberAccount:
                    description: |
                                  Destination account number with 20 digits. This can be a CLABE, Debit Card, or cell phone number (linked to an account) with a leading "0."  
                                  Output example:  
                                  `Cell phone: "00000000005562255651"`
                                  `TDD: "00004027665701414980"`
                                  `CLABE: "00002180010000054087"`
                    type: string
                  typeAccount:
                    description: Information related to the type of financial product.
                    type: object
                    required:
                      - id
                    properties:
                      id:
                        description: Credit account code
                                      `40 - CLABE Account`
                                      `03 - Debit Card
                                      `10 - Cell Phone`
                        type: string 
        status:
          description: |
            Information related to the status of the transfer.
          type: object
          required:
           - id
           - description
          properties:
            id:
              description: | 
                Transaction status code
                 `207 (Settled)`
                 `205 (In process)`
                 `301 (Returned)`
              type: string
              enum:
                - 207 (Settled)
                - 205 (In process)
                - 301 (Returned)
            description:
              description: | 
                Description of the status of the transaction.
                `LIQUIDADO: ` This status indicates that the payment has been successfully credited to the beneficiary's account.
                `EN PROCESO: ` The payment is currently being processed and is pending final settlement.
                `DEVUELTO: ` This status means the payment was NOT processed and the funds have been returned to the originating account.
              type: string
              enum:
                - LIQUIDADO
                - EN PROCESO
                - DEVUELTO
        operationDate:
          description: |
              Date on which the transaction was sent (DDMMYYYY)
          type: string
          format: "DDMMAAAA"
        numberReference: 
          description: | 
            Payment folio provided by the participant to uniquely identify the payment, with 7 positions.
          type: string
        devolutionDate:
          description: | 
            Return date.  
            Displayed exclusively for returns.  
            For "devolutionCode" fields other than 02 and 03, the constant 01010001 will be displayed.
            `Note:` Only applies if the transaction resulted in a return status.id of "301."
          type: string
          format: "DDMMAAAA"
        devolutionCode: 
          description: |
            Return Code. Displayed exclusively for returns.  
            Possible values indicating the return code.  
            `01    (Non-existent account)`
            `02    (Account blocked)`
            `03    (Account canceled)`
            `05    (Account in another currency)`
            `06    (Account does not belong to the Participant)`
            `14    (Missing mandatory information)`
            `15    (Incorrect payment type)`
            `16    (Incorrect operation type)`
            `17    (Account type does not correspond)`
            `19    (Invalid character)`
            `20    (Exceeds the authorized balance limit)`
            `21    (Exceeds the allowed deposit limit)`
            `22    (Mobile phone line number)`
            `23    (Additional account does not receive payments)`
            `24    (Information structure)`
            `25    (Missing instruction for disbursement)`
            `26    (Resolution resulting from the Agreement)`
            `27    (Optional payment not accepted)`
            `30    (Tracking key repeated)`
            `31    (Certificate of the Issuing Participant)`
            `D    (Unidentified reason)`

          type: string
        descriptionCode:
          description: |
            Description of the return.  
            Displayed exclusively for returns.  
            Example: If the "ReturnCode" field is "02," "Cuenta bloqueada" will be displayed.
          type: string
        payInstruction:
          description: |
            SPEI tracking key in 24-character  
            Format : APIC + #### + YYMMDD + entityId.applicationId  
            Example: “APIC01002503210026128252”  
            Corresponds to the “entityId.trackingId” field of the “spei-transfers” service
          type: string
        operationAmount:
          description: |
            Information related to the transfer amount.
          type: object
          required:
            - amount
          properties:
            amount:
              description: |
                SPEI Payment Amount.  
                The amount is a maximum of 13 integers and 2 decimal places, with no thousands separator and a period (.) as the decimal separator.  
                Example: 9999999999999.99
              type: string
      required:
        - trackingFolio
        - description
        - sender
        - receiver
        - status
        - operationDate
        - numberReference
        - devolutionDate
        - payInstruction
        - operationAmount


