                                Accumulation Type  
                                RG = Regular
                groupNumber:
                  type: string
                  description: |
                    Grouping number, depending on the service consumed  
                    `01	CONFIRMACIÓN CIE`
                    `02	PAGO CIE`
                    `03	CONSULTAS CIE`
                    `04	CONCILIACIÓN CIE`
                    `05	PAGO BBVA INDIVIDUAL`
                    `06	PAGO SPEI INDIVIDUAL`
                    `09	COMPROBANTE PDF`
                    `10	COMPROBANTES TXT`
                    `11	RETIRO SIN TARJETA`
                    `13	CONSULTA DE COMISIONES`
                    `14	CONSULTA SPEI`
                    `15	CODI QR`
                    `16	CODI PUSH`
                    `17	CODI NOTIFICACIÓN`
                    `18	CODI CONSULTA`
                    `19	CODI REPORTE`
