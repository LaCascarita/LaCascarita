  /transactions:
      summary: Transactions
      description: Operations inquiry.
      get: 
        tags:
          - 2-legged OAuth 
        summary: |
          Operations inquiry
        description: |
            Retrieve operations generated through the channel by specifying a date range, folio range, or a specific folio or transaction date. It is available for querying Internal Transfer, SPEI, and CIE payments processed via the API.
            `Note:` Queries can only be performed within the last 90 days from the current date, and date range queries are limited to a period that does not exceed 31 days.
            To query a specific date or folio, you must declare one of the date or transaction folio fields, along with the pagination key and page size
          
        parameters:
        - name: fromOperationDate
          description: |
                        String based on the ISO-8601 standard to specify the initial query date.
                        Format "YYYY-MM-DD"
                          - The queries are for up to 31 consecutive days. The date range must be within the last 90 days from the current date.
                          - Example: "2019-06-11"
          required: false
          in: query
          schema:
            description: |
                        String based on the ISO-8601 standard to specify the initial query date.
                        Format "YYYY-MM-DD"
                          - Example: "2019-06-11"
            example: '2019-06-11'
            type: string


        - name: toOperationDate
          description: |
                      String based on the ISO-8601 standard to specify the end date of the query.
                      Format "YYYY-MM-DD"
                        - The queries are for up to 31 consecutive days. The date range must be within the last 90 days from the current date.
                        - Example: "2019-06-11"
          required: false
          in: query
          schema:
            description: String based on the ISO-8601 standard to specify the end date of the query.
              Format "YYYY-MM-DD"
            example: '2019-11-06'
            type: string
        
        
        - name: beginTransaction
          description: |
                      Initial single consultation folio
                        - Example: "0000000099"
          required: true
          in: query
          schema:
            description: Final single consultation folio
            example: '0000000099'
            type: string
        - name: endTransaction
          description: |
                      Final single consultation folio
                        - Example: "0000000102"
          required: false
          in: query
          schema:
            description: Version.
            example: '0000000102'
            type: number

        - name: paginationKey
          description: |
                      Indicates which page to get
                      The fixed value for this field will always be 1
                        - Example: "1"
          required: true
          in: query
          schema:
            description: Indicates which page to get
                      The fixed value for this field will always be 1
            example: 2
            type: string
        
        - name: pageSize
          description:  Indicates how many records or operations to present          per page, the maximum is 50
          required: true
          in: query
          schema:
            description: Indicates how many records or operations to present          per page, the maximum is 50
            example: 50
            type: string
       
