                  type: object
                  properties:
                    amount:
                      type: string
                      description: Amount of the annual fee (if it exists)
                monthlyFee:
                  description: if your contract expecify a monthly fee it would be included otherwise , it will retourn "0.00"
                  type: object
                  properties:
                    amount:
                      type: string
                      description: Amount of the monthly charge for the use of the channel (if it exist)
                fixedFee:
                  type: object
                  description: if your contract expecify a fixed fee it would be included otherwise , it will retourn "0.00"
                  properties:
                    amount:
